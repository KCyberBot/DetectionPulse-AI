name: DetectionPulse AI


on:

  schedule:

    - cron: "0 * * * *"


  workflow_dispatch:



permissions:

  contents: write



jobs:


  detectionpulse:


    runs-on: ubuntu-latest


    steps:


      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"



      - name: Install dependencies

        run:

          pip install -r requirements.txt



      - name: Run DetectionPulse AI

        env:

          TELEGRAM_TOKEN:
            ${{ secrets.TELEGRAM_TOKEN }}

          TELEGRAM_CHAT_ID:
            ${{ secrets.TELEGRAM_CHAT_ID }}

          AI_TOKEN:
            ${{ secrets.AI_TOKEN }}

        run:

          python -m src.main



      - name: Save database changes

        run:

          |

          git config --global user.name "DetectionPulse Bot"

          git config --global user.email "bot@detectionpulse.ai"


          git add database/detectionpulse.db


          git commit -m "Update DetectionPulse database" || echo "No database changes"


          git push